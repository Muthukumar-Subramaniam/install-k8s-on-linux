# tasks file for version_cache_check_in_control_plane
---
- name: Check if version cache file exists in control plane node
  stat:
    path: /etc/inst-k8s-ansible-vars
  register: version_file_stat
  changed_when: false
  delegate_to: "{{ groups['k8s_cluster_ctrl_plane_node'][0] }}"

- name: Fetch version cache file from control plane node if it exists
  fetch:
    src: /etc/inst-k8s-ansible-vars
    dest: "/tmp/inst-k8s-ansible-vars-{{ inventory_hostname }}"
    flat: yes
  when: version_file_stat.stat.exists
  changed_when: false
  delegate_to: "{{ groups['k8s_cluster_ctrl_plane_node'][0] }}"

- name: Load version variables from fetched cache file
  include_vars:
    file: "/tmp/inst-k8s-ansible-vars-{{ inventory_hostname }}"
  when: version_file_stat.stat.exists
  delegate_to: "{{ item }}"
  with_items: "{{ groups['all'] }}"
  run_once: true

- name: Set fact if version cache loaded
  set_fact:
    version_cache_loaded: true
  when: version_file_stat.stat.exists
  delegate_to: "{{ item }}"
  with_items: "{{ groups['all'] }}"
  run_once: true

- name: Backward compatibility - map old variable names to new if detected
  set_fact:
    runc_version: "{{ runc_latest_version }}"
    containerd_version: "{{ containerd_latest_version }}"
    k8s_version: "{{ k8s_latest_version }}"
    k8s_version_major_minor: "{{ k8s_version_major_minor }}"
    calico_version: "{{ calico_latest_version | default('') }}"
    cilium_cli_version: "{{ cilium_cli_latest_version | default('') }}"
    k8s_cni_plugin: "{{ k8s_cni_plugin | default('calico') }}"
  when:
    - version_file_stat.stat.exists
    - runc_latest_version is defined
    - runc_version is not defined

- name: Upgrade old cache file to new variable names (Calico)
  become: true
  copy:
    dest: /etc/inst-k8s-ansible-vars
    content: |
      runc_version: "{{ runc_version }}"
      containerd_version: "{{ containerd_version }}"
      k8s_version: "{{ k8s_version }}"
      k8s_version_major_minor: "{{ k8s_version_major_minor }}"
      calico_version: "{{ calico_version }}"
      k8s_cni_plugin: "{{ k8s_cni_plugin }}"
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ groups['k8s_cluster_ctrl_plane_node'][0] }}"
  run_once: true
  when:
    - version_file_stat.stat.exists
    - runc_latest_version is defined
    - k8s_cni_plugin == "calico"

- name: Upgrade old cache file to new variable names (Cilium)
  become: true
  copy:
    dest: /etc/inst-k8s-ansible-vars
    content: |
      runc_version: "{{ runc_version }}"
      containerd_version: "{{ containerd_version }}"
      k8s_version: "{{ k8s_version }}"
      k8s_version_major_minor: "{{ k8s_version_major_minor }}"
      cilium_cli_version: "{{ cilium_cli_version }}"
      k8s_cni_plugin: "{{ k8s_cni_plugin }}"
    owner: root
    group: root
    mode: '0644'
  delegate_to: "{{ groups['k8s_cluster_ctrl_plane_node'][0] }}"
  run_once: true
  when:
    - version_file_stat.stat.exists
    - runc_latest_version is defined
    - k8s_cni_plugin == "cilium"

- name: Version details of software components installed in this cluster
  debug:
    msg:
      - "installed version of kubernetes  : {{ k8s_version | default('not loaded') }}"
      - "installed version of containerd  : {{ containerd_version | default('not loaded') }}"
      - "installed version of runc        : {{ runc_version | default('not loaded') }}"
      - "installed version of calico      : {{ calico_version | default('not loaded') }}"
      - "CNI plugin configured for this cluster        : {{ k8s_cni_plugin | default('not loaded') }}"
  when:
    - version_file_stat.stat.exists
    - k8s_cni_plugin | default('') == "calico"

- name: Version details of software components installed in this cluster
  debug:
    msg:
      - "installed version of kubernetes  : {{ k8s_version | default('not loaded') }}"
      - "installed version of containerd  : {{ containerd_version | default('not loaded') }}"
      - "installed version of runc        : {{ runc_version | default('not loaded') }}"
      - "installed version of cilium CLI  : {{ cilium_cli_version | default('not loaded') }}"
      - "CNI plugin configured for this cluster        : {{ k8s_cni_plugin | default('not loaded') }}"
  when:
    - version_file_stat.stat.exists
    - k8s_cni_plugin | default('') == "cilium"
