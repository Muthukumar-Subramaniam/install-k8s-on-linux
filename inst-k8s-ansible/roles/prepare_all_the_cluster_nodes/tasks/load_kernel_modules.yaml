- name: Install kernel-modules-extra for br_netfilter (RedHat based systems)
  become: true
  dnf:
    name: "kernel-modules-extra-{{ ansible_kernel }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Load the required kernel modules
  become: true
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Create /etc/modules-load.d/k8s.conf for the above loaded modules to be persistent
  become: true
  blockinfile:
    create: true
    path: /etc/modules-load.d/k8s.conf
    block: |
      overlay
      br_netfilter
    state: present

